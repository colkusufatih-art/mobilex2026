name: mobilex2025
description: Crealogix Mobile Banking App 2025 - Material 3 Design System
publish_to: 'none'
version: 1.0.19+20

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_svg: any
  material_symbols_icons: ^4.2212.0
  google_fonts: ^8.2.1
  gap: ^3.0.1
  intl: ^0.20.3
  go_router: ^17.5.0
  shared_preferences: ^2.5.5
  pdf: ^3.13.0
  printing: ^5.15.0
  mobile_scanner: ^7.4.0
  file_picker: ^12.0.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_gen_runner: ^5.15.0
  build_runner: ^2.16.0

flutter:
  config:
    enable-swift-package-manager: true
  uses-material-design: true
  
  assets:
    - assets/img/
    - assets/img/Logo.png
    - assets/img/building.png
    - assets/img/bild.png
    - assets/img/CLX_Login_215x55-LM.png
    - assets/img/CLX_Login_215x55-DM.png
    - assets/img/volksbank_wien_logo.png
    - assets/img/hypotirol_logo.png
    - assets/img/Slider-1.png
    - assets/img/Slider-2.png
    - assets/img/Slider-3.png
    - assets/img/QR Code.png
    - assets/img/Mobile_Policy.pdf
    - assets/img/Image_Web_Person_Woman-Man-sitting-laptop.jpg
    - assets/img/GettyImages-1183921668.jpg
    - assets/img/GettyImages-1309085617.jpg
    - assets/data/
